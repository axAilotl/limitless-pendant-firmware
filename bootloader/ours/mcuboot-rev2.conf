# MCUboot configuration for rev2: one app slot, ECDSA-P256, serial recovery
# over CDC ACM. Build with the overlay next to this file on board
# nrf5340dk_nrf5340_cpuapp (Zephyr 3.5 tree, SDK 0.16.4, CMake 3.31.x).
# Point the key file at your own public key to build a loader that trusts you.
CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0110
CONFIG_USB_DEVICE_MANUFACTURER="Cissa"
CONFIG_USB_DEVICE_PRODUCT="Pendant Bootloader R2"
CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/your-pub.pem"
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
