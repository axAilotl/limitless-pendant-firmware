# swd.cfg — CMSIS-DAP probe and the nRF5340 app core (AP0). Run from this directory.
adapter driver cmsis-dap
transport select swd
adapter speed 125
swd newdap ndap dap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create ndap.dap -chain-position ndap.dap
source nrferaseall.tcl
target create ndap.cpu cortex_m -dap ndap.dap -ap-num 0
ndap.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0
cortex_m reset_config sysresetreq
